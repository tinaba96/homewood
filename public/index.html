<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131417" media="(prefers-color-scheme: dark)">
  <meta name="description" content="シェアハウスの洗濯機予約と掃除当番">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="homewood">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>homewood</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <h1 class="logo"><img src="/icon.svg" alt="" width="28" height="28">homewood</h1>
    <button class="me" id="me-btn" type="button" hidden aria-label="ユーザーを切り替える"></button>
  </header>

  <main id="view" aria-live="polite"><p class="empty">読み込み中…</p></main>

  <nav class="tabbar" id="tabs" hidden aria-label="メニュー">
    <a href="#board" data-tab="board">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H12l-4.5 4v-4h-1A2.5 2.5 0 0 1 4 13.5z"/><path d="M8 8h8M8 11.5h5"/></svg>
      <span>掲示板</span>
    </a>
    <a href="#laundry" data-tab="laundry">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="3"/><circle cx="12" cy="13.5" r="4.5"/><path d="M7.8 6h.01M10.5 6h2.5"/></svg>
      <span>洗濯</span>
    </a>
    <a href="#chores" data-tab="chores">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3.5l1.6 4.4 4.4 1.6-4.4 1.6L10 15.5l-1.6-4.4L4 9.5l4.4-1.6z"/><path d="M17.5 13.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></svg>
      <span>掃除</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
      <span>設定</span>
    </a>
  </nav>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="handle-zone" aria-hidden="true"><div class="handle"></div></div>
    <div id="sheet-body"></div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
